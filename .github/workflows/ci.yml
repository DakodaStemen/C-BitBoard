name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Build (warnings are errors)
        run: make clean && make CC=${{ matrix.cc }} NATIVE=0 CFLAGS="-std=c11 -Wall -Wextra -Werror -O3"
      - name: Smoke test
        run: |
          ./cbitboard 4 | tee /dev/stderr | grep -q "Nodes: 197281"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make debug
      - name: Perft + search under sanitizers
        run: |
          ./cbitboard 4
          ./cbitboard "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq -" hashcheck 3
          ./cbitboard bench 5

  perft:
    name: Perft suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make NATIVE=0
      - name: Standard positions (startpos, Kiwipete, CPW 3-6)
        run: ./tests/perft_suite.sh ./cbitboard quick | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Incremental Zobrist == recompute (every perft node)
        run: |
          ./cbitboard "" hashcheck 4 | tee /dev/stderr | grep -q "Hash mismatches: 0"
          ./cbitboard "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq -" hashcheck 4 | grep -q "Hash mismatches: 0"
          ./cbitboard "r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1" hashcheck 4 | grep -q "Hash mismatches: 0"

  uci:
    name: UCI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install chess
      - run: make NATIVE=0
      - run: python tests/uci_test.py ./cbitboard

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make NATIVE=0
      - name: Bench signature (deterministic node count, tests/bench_nodes.txt)
        run: ./tests/bench.sh ./cbitboard
      - name: Search bench + perft speed
        run: |
          { echo '### Search bench'; echo '```'; ./cbitboard bench; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          { echo '### Perft speed'; ./tests/perft_suite.sh ./cbitboard quick; } | tee -a "$GITHUB_STEP_SUMMARY"
